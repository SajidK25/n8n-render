services:
  - name: n8n
    type: web
    runtime: docker
    plan: free
    repo: https://github.com/SajidK25/n8n-render.git
    region: oregon
    rootDir: ./.devcontainer
    dockerCommand: sleep infinity # Default: Dockerfile CMD
    scaling: # Autoscaling configuration
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 60 # Optional if targetCPUPercent is set
      targetCPUPercent: 60 # Optional if targetMemory is set
    healthCheckPath: /
    # registryCredential: # Default: No credential
    #   fromRegistryCreds:
    #     name: my-credentials
    disk:
      name: 
      mountPath: 
    envVars:
      - key: DB_POSTGRESDB_HOST
        fromService: # Reference a property from another service (see available properties below)
          type: keyvalue
          name: postgres
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromService:
          type: keyvalue
          name: postgres
          property: password
      - key: DB_TYPE
        value: postgresdb

databases:
  - name: postgres # A Render Postgres database named django-app-db running on a free instance
    plan: free
